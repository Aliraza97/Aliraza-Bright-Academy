["Which compound can exhibit cis-trans isomerism?",["1,2-Dichloroethene","Ethene","Ethyne","1,1-Dichloroethene"],0],
["Benzene was first isolated in 1825 by ___ and its structure was proposed in 1865 by ___.",["Kekulé, Faraday","Faraday, Hückel","Faraday, Kekulé","Hückel, Kekulé"],2],
["The unusual stability of benzene is mainly due to:",["Ionic bonding","Six C–H sigma bonds","Delocalization of six π electrons","sp³ hybridization"],2],
["Chlorine reacts with benzene under UV light to form:",["Chlorobenzene","1,2-Dichlorobenzene","Hexachlorobenzene","Hexachlorocyclohexane"],3],
["In the arenium ion formed during electrophilic substitution, the carbon attached to both H and the electrophile is:",["Unhybridized","sp³ hybridized","sp² hybridized","sp hybridized"],1],
["The electrophile involved in benzene nitration is:",["HSO₄⁻","NO₂⁺","NO₃⁻","NO₂⁻"],1],
["Which catalyst is commonly used for benzene halogenation at room temperature?",["HgSO₄","Ni","FeCl₃","AlCl₃"],2],
["The electrophile in Friedel–Crafts acylation is:",["RCO⁺","Cl⁺","NO₂⁺","R⁺"],0],
["Which group acts as a meta director?",["–CH₃","–Cl","–OH","–NO₂"],3],
["How many moles of HNO₃ are required to convert one mole of toluene into TNT?",["4","3","1","2"],1],
["Which biofuel is obtained through fermentation of starch or sugar?",["Biomethane","Biodiesel","Bioethanol","Biogas"],2]
];

const N = Q.length;
let answers = new Array(N).fill(null);
let lastPayload = null;
let startTime = 0, timer = null;

const $ = id => document.getElementById(id);
const show = id => {
  ["test","result","blocked"].forEach(s => { $(s).hidden = s !== id; });
  window.scrollTo(0, 0);
};
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function buildTest() {
  const qs = $("questions"), nav = $("nav");
  qs.innerHTML = ""; nav.innerHTML = "";
  Q.forEach((q, i) => {
    const d = document.createElement("div");
    d.className = "q"; d.id = "q" + i;
    const p = document.createElement("p");
    p.className = "q-text";
    p.innerHTML = '<span class="q-num">' + (i + 1) + '.</span><span></span>';
    p.lastChild.textContent = q[0];
    d.appendChild(p);
    const o = document.createElement("div");
    o.className = "opts"; o.setAttribute("role", "radiogroup");
    q[1].forEach((t, j) => {
      const l = document.createElement("label");
      l.className = "opt";
      l.innerHTML = '<input type="radio" name="q' + i + '" value="' + j + '"><span><b>' + LET[j] + ')</b></span>';
      l.querySelector("span").append(document.createTextNode(t));
      l.querySelector("input").addEventListener("change", () => { answers[i] = j; refresh(); });
      o.appendChild(l);
    });
    d.appendChild(o);
    qs.appendChild(d);

    const b = document.createElement("button");
    b.type = "button"; b.className = "dot"; b.id = "dot" + i;
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Go to question " + (i + 1));
    b.addEventListener("click", () => $("q" + i).scrollIntoView({ behavior: "smooth", block: "start" }));
    nav.appendChild(b);
  });
}

function refresh() {
  const done = answers.filter(a => a !== null).length;
  $("count").textContent = done + " of " + N + " answered";
  $("fill").style.width = (done / N * 100) + "%";
  answers.forEach((a, i) => {
    const dot = $("dot" + i);
    if (dot) {
      dot.classList.toggle("done", a !== null);
      if (a !== null) { dot.classList.remove("missing"); $("q" + i).classList.remove("missing"); }
    }
  });
  if (done === N) $("msg").textContent = "";
}

function startTimer() {
  startTime = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { $("clock").textContent = fmt(Math.floor((Date.now() - startTime) / 1000)); }, 1000);
  $("clock").textContent = "0:00";
}

function sendToSheet(payload) {
  if (!SHEET_URL) return;
  const d = Object.assign({}, payload);
  delete d.access_key;
  try {
    fetch(SHEET_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(d)
    }).catch(() => {});
  } catch (e) {}
}

async function sendResult() {
  const st = $("sendStatus");
  const rb = $("resendBtn");
  if (rb) rb.hidden = true;
  if (!WEB3FORMS_KEY || WEB3FORMS_KEY.indexOf("PASTE") === 0) {
    st.className = "sendstatus warn";
    st.textContent = "Email is not configured. Please show this screen to your teacher.";
    return;
  }
  st.className = "sendstatus";
  st.textContent = "Sending your result to the teacher…";
  try {
    const r = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(lastPayload)
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && (j.success === true || j.message)) {
      st.className = "sendstatus ok";
      st.textContent = "Your result has been sent to the teacher.";
      try { localStorage.removeItem(PEND_KEY); } catch (e) {}
    } else {
      throw new Error(j.message || "Send failed");
    }
  } catch (err) {
    st.className = "sendstatus err";
    st.textContent = "Could not send: " + (err.message || "network error") + ". You can try again.";
    if (rb) rb.hidden = false;
  }
}

function submitTest() {
  const name = $("name").value.trim();
  if (!name) {
    $("msg").textContent = "Please enter your name before submitting.";
    $("name").focus();
    $("name").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const missing = [];
  answers.forEach((a, i) => { if (a === null) missing.push(i); });
  if (missing.length) {
    missing.forEach(i => {
      $("q" + i).classList.add("missing");
      $("dot" + i).classList.add("missing");
    });
    $("msg").textContent = missing.length + (missing.length === 1 ? " question is" : " questions are") + " still unanswered. Please answer all questions before submitting.";
    $("q" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  clearInterval(timer);
  const secs = Math.floor((Date.now() - startTime) / 1000);
  let right = 0;
  answers.forEach((a, i) => { if (a === Q[i][2]) right++; });
  const pct = Math.round(right / N * 100);

  $("who").textContent = name;

  const wrongList = Q.map((q, i) =>
    answers[i] === q[2] ? null :
    "Q" + (i + 1) + ": chose " + LET[answers[i]] + " (" + q[1][answers[i]] + "), correct " + LET[q[2]] + " (" + q[1][q[2]] + ")"
  ).filter(Boolean).join("\n") || "None";

  const sheet = Q.map((q, i) =>
    (i + 1) + ". " + (answers[i] === q[2] ? "correct" : "wrong") +
    " – chose " + LET[answers[i]] + (answers[i] === q[2] ? "" : ", correct is " + LET[q[2]])
  ).join("\n");

  lastPayload = {
    access_key: WEB3FORMS_KEY,
    subject: "MCQ Test Result: " + name + " - " + right + "/" + N + " (" + pct + "%)",
    from_name: "Ali Raza Bright Academy",
    student_name: name,
    test_title: TEST_TITLE,
    total_score: right + " / " + N,
    percentage: pct + "%",
    chemistry: right + " / " + N,
    time_taken: fmt(secs),
    submitted_at: new Date().toLocaleString(),
    score: right,
    out_of: N,
    percent: pct,
    incorrect_answers: wrongList,
    answer_sheet: sheet
  };

  lsSet(DONE_KEY, "1");
  lsSet(PEND_KEY, JSON.stringify(lastPayload));
  sendToSheet(lastPayload);
  sendResult();
  show("result");
}

function showAlreadyDone() {
  show("blocked");
  const st = $("blockStatus");
  const pend = lsGet(PEND_KEY);
  let parsed = null;
  if (pend) { try { parsed = JSON.parse(pend); } catch (e) {} }
  if (parsed) {
    lastPayload = parsed;
    st.className = "sendstatus";
    st.textContent = "Retrying to send your previous result…";
    sendResult().then(() => {
      const s2 = $("sendStatus");
      if (s2 && s2.textContent) {
        st.className = s2.className;
        st.textContent = s2.textContent;
      }
    });
  } else {
    st.className = "sendstatus ok";
    st.textContent = "Your result was already sent to the teacher.";
  }
}

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C" || e.key === "u" || e.key === "U" || e.key === "s" || e.key === "S" || e.key === "p" || e.key === "P")) {
    e.preventDefault();
  }
  if (e.key === "PrintScreen") e.preventDefault();
});
document.addEventListener("keyup", e => {
  if (e.key === "PrintScreen") {
    navigator.clipboard && navigator.clipboard.writeText("").catch(() => {});
  }
});

$("submitBtn").addEventListener("click", submitTest);
$("resendBtn").addEventListener("click", () => sendResult());

if (lsGet(DONE_KEY) === "1") {
  showAlreadyDone();
} else {
  buildTest();
  refresh();
  startTimer();
  show("test");
}
</script>
</body>
</html>
