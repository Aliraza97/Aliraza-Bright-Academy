<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ali Raza Bright Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #eaeff6;
  --card: #ffffff;
  --text: #1a2233;
  --muted: #5d6880;
  --line: #d9e0ec;
  --accent: #3b3fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e6e8ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141f;
    --card: #1a2030;
    --text: #e8ecf6;
    --muted: #97a2bb;
    --line: #2b344b;
    --accent: #8b90ff;
    --accent-ink: #10141f;
    --accent-soft: #262a52;
  }
}
:root[data-theme="dark"] {
  --bg: #10141f;
  --card: #1a2030;
  --text: #e8ecf6;
  --muted: #97a2bb;
  --line: #2b344b;
  --accent: #8b90ff;
  --accent-ink: #10141f;
  --accent-soft: #262a52;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 56px; }

.hero {
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px 20px 24px;
  margin-bottom: 22px;
}
.hero img {
  width: 96px; height: 96px; border-radius: 50%;
  object-fit: cover; margin-bottom: 12px;
  border: 3px solid var(--accent-soft);
}
.hero h1 { margin: 0 0 4px; font-size: 1.55rem; line-height: 1.2; }
.hero p { margin: 0; color: var(--muted); }

.section-title {
  font-size: 1.05rem; font-weight: 700; margin: 0 0 12px;
  color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 16px;
  margin-bottom: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.card h2 { margin: 0; font-size: 1.15rem; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.meta li {
  background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 3px 11px; font-size: .85rem; font-weight: 700;
}
.card p { margin: 0; color: var(--muted); font-size: .95rem; }
.btn {
  display: inline-block; text-align: center; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
  padding: 12px 18px; font-weight: 700; font: inherit; cursor: pointer;
  margin-top: 4px;
}
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.footer {
  text-align: center; color: var(--muted); font-size: .9rem; margin-top: 28px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="logo.png" alt="Ali Raza Bright Academy" width="96" height="96">
    <h1>Ali Raza Bright Academy</h1>
    <p>Online MCQ tests for Class XI students</p>
  </div>

  <p class="section-title">Available tests</p>
  <div id="list"></div>

  <p class="footer">One attempt per device · Results sent to teacher only</p>
</div>

<script>
const TESTS = [
  {
    title: "Class XI Chemistry & English",
    level: "Class XI",
    subjects: ["Chemistry", "English"],
    questions: 40,
    file: "class-xi-chemistry-english.html"
  },
  {
    title: "Class XI Chemistry – Organic Compounds, Nomenclature & Hydrocarbons",
    level: "Class XI",
    subjects: ["Chemistry"],
    questions: 100,
    file: "class-xi-chemistry-organic-hydrocarbons.html"
  }
];

const list = document.getElementById("list");
TESTS.forEach(t => {
  const card = document.createElement("article");
  card.className = "card";
  const h = document.createElement("h2");
  h.textContent = t.title;
  card.appendChild(h);

  const ul = document.createElement("ul");
  ul.className = "meta";
  [t.level, ...t.subjects, t.questions + " questions"].forEach(txt => {
    const li = document.createElement("li");
    li.textContent = txt;
    ul.appendChild(li);
  });
  card.appendChild(ul);

  const a = document.createElement("a");
  a.className = "btn";
  a.href = t.file;
  a.textContent = "Start test";
  card.appendChild(a);

  list.appendChild(card);
});
</script>
</body>
</html>
