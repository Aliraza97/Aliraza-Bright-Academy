<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Class XI Chemistry MCQ Test – Ali Raza Bright Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1a1a2e;
  --muted: #5a6577;
  --primary: #1a3a6b;
  --primary-light: #e8eef7;
  --accent: #d4a017;
  --success: #0d7a3f;
  --danger: #c0392b;
  --border: #d0d7e2;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --radius: 10px;
  --sticky-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e8ecf1;
    --muted: #9aa5b5;
    --primary: #5b9bd5;
    --primary-light: #243447;
    --accent: #e6b422;
    --success: #2ecc71;
    --danger: #e74c3c;
    --border: #2d3a4d;
    --shadow: 0 2px 12px rgba(0,0,0,.35);
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 100px;
}
img { max-width: 100%; height: auto; display: block; }

/* Header */
.header {
  text-align: center;
  padding: 1.25rem 1rem 0.75rem;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.logo {
  width: 110px;
  height: 110px;
  margin: 0 auto 0.75rem;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: var(--shadow);
}
.header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.02em;
}
.header .sub {
  font-size: 0.9rem;
  color: var(--muted);
  margin-top: 0.25rem;
}

/* Name box */
.name-section {
  max-width: 720px;
  margin: 1rem auto;
  padding: 0 1rem;
}
.name-section label {
  display: block;
  font-weight: 600;
  font-size: 0.95rem;
  margin-bottom: 0.35rem;
}
.name-section input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  font-size: 1rem;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.name-section input:focus { border-color: var(--primary); }
.name-section input.error { border-color: var(--danger); background: #fff5f5; }
@media (prefers-color-scheme: dark) {
  .name-section input.error { background: #3a1f1f; }
}

/* Sticky bar */
.sticky-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 0.5rem 1rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem 1rem;
  min-height: var(--sticky-h);
}
.progress-info {
  font-size: 0.9rem;
  font-weight: 600;
  white-space: nowrap;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--primary);
  font-size: 0.95rem;
}
.progress-track {
  flex: 1;
  min-width: 100px;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--primary);
  border-radius: 4px;
  transition: width .3s ease;
}

/* Navigator */
.nav-grid {
  max-width: 720px;
  margin: 1rem auto;
  padding: 0 1rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
  gap: 6px;
}
.nav-btn {
  aspect-ratio: 1;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn:hover { border-color: var(--primary); }
.nav-btn.answered {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.nav-btn.unanswered-highlight {
  background: #fde8e8;
  border-color: var(--danger);
  color: var(--danger);
}
@media (prefers-color-scheme: dark) {
  .nav-btn.unanswered-highlight {
    background: #3a1f1f;
    color: #ff8a80;
  }
}

/* Questions */
.questions {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 1rem 2rem;
}
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
  scroll-margin-top: calc(var(--sticky-h) + 12px);
}
.q-card.unanswered-highlight {
  border-color: var(--danger);
  box-shadow: 0 0 0 2px rgba(192,57,43,.25);
}
.q-num {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 0.4rem;
}
.q-text {
  font-size: 1rem;
  font-weight: 500;
  margin-bottom: 0.85rem;
  line-height: 1.45;
}
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.opt {
  flex: 1 1 auto;
  min-width: 140px;
  display: flex;
  align-items: flex-start;
  gap: 0.45rem;
  padding: 0.55rem 0.7rem;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 0.92rem;
}
.opt:hover { border-color: var(--primary); }
.opt.selected {
  border-color: var(--primary);
  background: var(--primary-light);
}
.opt input {
  margin-top: 0.15rem;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.opt span { flex: 1; word-break: break-word; }

/* Submit */
.submit-wrap {
  max-width: 720px;
  margin: 1.5rem auto 3rem;
  padding: 0 1rem;
  text-align: center;
}
.submit-btn {
  width: 100%;
  max-width: 320px;
  padding: 0.9rem 1.5rem;
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  background: var(--primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: opacity .2s, transform .1s;
}
.submit-btn:hover { opacity: 0.92; }
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Result screens */
.screen {
  max-width: 520px;
  margin: 3rem auto;
  padding: 2rem 1.25rem;
  text-align: center;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.screen h2 {
  font-size: 1.4rem;
  color: var(--primary);
  margin-bottom: 0.75rem;
}
.screen p {
  color: var(--muted);
  margin-bottom: 0.5rem;
  font-size: 1rem;
}
.screen .name-display {
  font-weight: 700;
  color: var(--text);
  font-size: 1.15rem;
  margin-bottom: 1rem;
}
.retry-btn {
  margin-top: 1.25rem;
  padding: 0.7rem 1.4rem;
  font-size: 0.95rem;
  font-weight: 600;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.error-msg {
  color: var(--danger);
  font-size: 0.9rem;
  margin-top: 0.75rem;
  word-break: break-word;
}
.hidden { display: none !important; }

/* Subscripts etc already plain text */
sub, sup { font-size: 0.75em; }
</style>
</head>

    { q: "Which catalyst is commonly used for benzene halogenation at room temperature?", opts: ["HgSO₄","Ni","FeCl₃","AlCl₃"] },
    { q: "The electrophile in Friedel–Crafts acylation is:", opts: ["RCO⁺","Cl⁺","NO₂⁺","R⁺"] },
    { q: "Which group acts as a meta director?", opts: ["–CH₃","–Cl","–OH","–NO₂"] },
    { q: "How many moles of HNO₃ are required to convert one mole of toluene into TNT?", opts: ["4","3","1","2"] },
    { q: "Which biofuel is obtained through fermentation of starch or sugar?", opts: ["Biomethane","Biodiesel","Bioethanol","Biogas"] }
  ];

  // State
  let answers = new Array(TOTAL).fill(null);
  let startTime = Date.now();
  let timerInterval = null;
  let pendingPayload = null;

  // ---------- localStorage helpers ----------
  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); return true; } catch (e) { return false; }
  }
  function safeRemove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // ---------- Check already taken ----------
  const stored = safeGet(STORAGE_KEY);
  if (stored) {
    try {
      const data = JSON.parse(stored);
      if (data.submitted) {
        if (data.sent) {
          document.getElementById("alreadyTaken").classList.remove("hidden");
          document.getElementById("testApp").classList.add("hidden");
          return;
        } else {
          // Not sent successfully – keep payload and show result screen with retry
          pendingPayload = data.payload;
          document.getElementById("testApp").classList.add("hidden");
          document.getElementById("resultScreen").classList.remove("hidden");
          document.getElementById("resultName").textContent = data.payload.student_name || "";
          document.getElementById("sendError").textContent = "Previous send failed. Please try again.";
          document.getElementById("sendError").classList.remove("hidden");
          document.getElementById("retryBtn").classList.remove("hidden");
          // still allow retry
        }
      }
    } catch (e) {}
  }

  // ---------- Render questions ----------
  const qContainer = document.getElementById("questions");
  const navGrid = document.getElementById("navGrid");
  const letters = ["A", "B", "C", "D"];

  QUESTIONS.forEach((item, i) => {
    // Nav button
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "nav-btn";
    btn.textContent = i + 1;
    btn.dataset.idx = i;
    btn.addEventListener("click", () => {
      document.getElementById("q" + i).scrollIntoView({ behavior: "smooth", block: "start" });
    });
    navGrid.appendChild(btn);

    // Question card
    const card = document.createElement("div");
    card.className = "q-card";
    card.id = "q" + i;

    let optsHtml = item.opts.map((o, j) =>
      `<label class="opt" data-q="${i}" data-opt="${j}">
        <input type="radio" name="q${i}" value="${j}">
        <span><strong>${letters[j]})</strong> ${o}</span>
      </label>`
    ).join("");

    card.innerHTML =
      `<div class="q-num">Question ${i + 1}</div>
       <div class="q-text">${item.q}</div>
       <div class="options">${optsHtml}</div>`;

    qContainer.appendChild(card);
  });

  // Option click handling
  qContainer.addEventListener("change", function (e) {
    if (e.target.type !== "radio") return;
    const qIdx = parseInt(e.target.name.slice(1), 10);
    const optIdx = parseInt(e.target.value, 10);
    answers[qIdx] = optIdx;

    // Visual selected
    const card = document.getElementById("q" + qIdx);
    card.querySelectorAll(".opt").forEach(el => el.classList.remove("selected"));
    e.target.closest(".opt").classList.add("selected");

    // Nav update
    navGrid.children[qIdx].classList.add("answered");
    navGrid.children[qIdx].classList.remove("unanswered-highlight");
    card.classList.remove("unanswered-highlight");

    updateProgress();
  });

  // Also allow clicking the label area
  qContainer.addEventListener("click", function (e) {
    const label = e.target.closest(".opt");
    if (!label) return;
    const radio = label.querySelector("input");
    if (radio && !radio.checked) {
      radio.checked = true;
      radio.dispatchEvent(new Event("change", { bubbles: true }));
    }
  });

  function updateProgress() {
    const answered = answers.filter(a => a !== null).length;
    document.getElementById("answeredCount").textContent = answered + " of " + TOTAL + " answered";
    document.getElementById("progressFill").style.width = (answered / TOTAL * 100) + "%";
  }

  // Timer
  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }
  timerInterval = setInterval(() => {
    document.getElementById("timer").textContent = formatTime(Date.now() - startTime);
  }, 1000);

  // ---------- Submit ----------
  document.getElementById("submitBtn").addEventListener("click", function () {
    const nameInput = document.getElementById("studentName");
    const name = nameInput.value.trim();

    // Clear previous highlights
    document.querySelectorAll(".unanswered-highlight").forEach(el => el.classList.remove("unanswered-highlight"));
    nameInput.classList.remove("error");

    let firstMissing = null;

    if (!name) {
      nameInput.classList.add("error");
      nameInput.focus();
      firstMissing = nameInput;
    }

    for (let i = 0; i < TOTAL; i++) {
      if (answers[i] === null) {
        document.getElementById("q" + i).classList.add("unanswered-highlight");
        navGrid.children[i].classList.add("unanswered-highlight");
        if (firstMissing === null) firstMissing = document.getElementById("q" + i);
      }
    }

    if (firstMissing) {
      firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    // All good – compute score
    clearInterval(timerInterval);
    const timeTaken = formatTime(Date.now() - startTime);
    const submittedAt = new Date().toISOString();

    let score = 0;
    const incorrect = [];
    const answerSheet = [];
    const subjectScores = SUBJECTS.map(s => ({ name: s.name, correct: 0, total: s.end - s.start + 1 }));

    for (let i = 0; i < TOTAL; i++) {
      const correct = ANSWERS[i];
      const chosen = answers[i];
      const isCorrect = chosen === correct;
      if (isCorrect) score++;

      const letterC = letters[correct];
      const letterCh = letters[chosen];
      answerSheet.push(
        (i + 1) + ". " + (isCorrect ? "Correct" : "Wrong") +
        " (chose " + letterCh + ", correct " + letterC + ")"
      );
      if (!isCorrect) {
        incorrect.push(
          "Q" + (i + 1) + ": chose " + letterCh + ") " + QUESTIONS[i].opts[chosen] +
          " | correct " + letterC + ") " + QUESTIONS[i].opts[correct]
        );
      }

      // subject
      for (const ss of subjectScores) {
        if (i + 1 >= ss.start && i + 1 <= ss.end && isCorrect) ss.correct++;
      }
    }

    const percentage = Math.round((score / TOTAL) * 1000) / 10;
    const subjectStr = subjectScores.map(s => s.name + ": " + s.correct + "/" + s.total).join("; ");

    const payload = {
      access_key: ACCESS_KEY,
      subject: "MCQ Test Result: " + name + " - " + score + "/" + TOTAL + " (" + percentage + "%)",
      from_name: name,
      student_name: name,
      total_score: score + "/" + TOTAL,
      percentage: percentage + "%",
      subject_wise_scores: subjectStr,
      time_taken: timeTaken,
      submitted_at: submittedAt,
      incorrect_answers: incorrect.length ? incorrect.join("\n") : "None",
      answer_sheet: answerSheet.join("\n")
    };

    pendingPayload = payload;

    // Save submitted flag
    safeSet(STORAGE_KEY, JSON.stringify({
      submitted: true,
      sent: false,
      payload: payload
    }));

    // Hide test, show result
    document.getElementById("testApp").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");
    document.getElementById("resultName").textContent = name;

    sendResult(payload);
  });

  // ---------- Send via Web3Forms ----------
  async function sendResult(payload) {
    const errEl = document.getElementById("sendError");
    const retryBtn = document.getElementById("retryBtn");
    errEl.classList.add("hidden");
    retryBtn.classList.add("hidden");

    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok && data.success) {
        // Mark as sent
        safeSet(STORAGE_KEY, JSON.stringify({
          submitted: true,
          sent: true,
          payload: null
        }));
        errEl.classList.add("hidden");
        retryBtn.classList.add("hidden");
      } else {
        throw new Error(data.message || "Server returned an error");
      }
    } catch (err) {
      errEl.textContent = "Sending failed: " + (err.message || "Network error");
      errEl.classList.remove("hidden");
      retryBtn.classList.remove("hidden");
    }
  }

  document.getElementById("retryBtn").addEventListener("click", function () {
    if (pendingPayload) sendResult(pendingPayload);
  });

})();
</script>
</body>
</html>
