<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #1a1a2e;

  --primary-light: #2c5282;
  --accent: #d69e2e;
  --accent-dark: #b7791f;
  --border: #e2e8f0;
  --success: #276749;
  --danger: #c53030;
  --danger-bg: #fff5f5;
  --progress-bg: #e2e8f0;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 10px;
  --nav-answered: #2c5282;
  --nav-unanswered: #e2e8f0;
  --nav-current: #d69e2e;
  --nav-wrong: #fc8181;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e8eaed;
    --text-muted: #a0aec0;
    --primary: #63b3ed;
    --primary-light: #90cdf4;
    --accent: #ecc94b;
    --accent-dark: #d69e2e;
    --border: #2d3748;
    --success: #68d391;
    --danger: #fc8181;
    --danger-bg: #2d1b1b;
    --progress-bg: #2d3748;
    --shadow: 0 2px 12px rgba(0,0,0,0.35);
    --nav-answered: #3182ce;
    --nav-unanswered: #2d3748;
    --nav-current: #ecc94b;
    --nav-wrong: #e53e3e;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 100px;
}
.container { max-width: 860px; margin: 0 auto; padding: 12px 14px; }

/* Header */
.header {
  text-align: center;
  padding: 18px 12px 12px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.logo {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 10px;
  display: block;
  border: 3px solid var(--accent);
}
.header h1 {
  font-size: 1.25rem;
  color: var(--primary);
  margin-bottom: 2px;
  font-weight: 700;
}
.header .subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
  font-weight: 500;
}

/* Name field */
.name-box {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.name-box label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--primary);
  font-size: 0.95rem;
}
.name-box input {
  width: 100%;
  padding: 10px 12px;
  font-size: 1rem;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.name-box input:focus { border-color: var(--primary); }
.name-box input.error { border-color: var(--danger); background: var(--danger-bg); }

/* Sticky bar */
.sticky-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--card);
  border-bottom: 2px solid var(--border);
  padding: 10px 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  margin: 0 -14px 14px;
}
.sticky-inner {
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  justify-content: space-between;
}
.progress-info {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--primary);
  white-space: nowrap;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--accent-dark);
  background: var(--bg);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.progress-track {
  flex: 1 1 120px;
  height: 8px;
  background: var(--progress-bg);
  border-radius: 4px;
  overflow: hidden;
  min-width: 80px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 4px;
  width: 0%;
  transition: width 0.25s ease;
}

/* Navigator */
.nav-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.nav-section h3 {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 8px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
  gap: 6px;
}
.nav-btn {
  width: 100%;
  aspect-ratio: 1;
  border: 2px solid var(--border);
  border-radius: 6px;
  background: var(--nav-unanswered);
  color: var(--text);
  font-weight: 600;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn.answered {
  background: var(--nav-answered);
  color: #fff;
  border-color: var(--nav-answered);
}
.nav-btn.current {
  border-color: var(--nav-current);
  box-shadow: 0 0 0 2px var(--nav-current);
}
.nav-btn.unanswered-highlight {
  background: var(--nav-wrong);
  color: #fff;
  border-color: var(--danger);
  animation: pulse 0.8s ease 2;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* Questions */
.subject-heading {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--primary);
  margin: 20px 0 10px;
  padding-bottom: 4px;
  border-bottom: 2px solid var(--accent);
}
.q-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  scroll-margin-top: 70px;
}
.q-card.unanswered-highlight {
  border-color: var(--danger);
  background: var(--danger-bg);
}
.q-num {
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
  font-size: 0.9rem;
}
.q-text {
  margin-bottom: 12px;
  font-size: 1rem;
  line-height: 1.45;
}
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.opt-label {
  flex: 1 1 140px;
  min-width: 120px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  background: var(--bg);
  transition: all 0.15s;
  font-size: 0.95rem;
}
.opt-label:hover { border-color: var(--primary-light); }
.opt-label.selected {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 12%, transparent);
}
.opt-label input {
  margin-top: 3px;
  accent-color: var(--primary);
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}
.opt-text { flex: 1; word-break: break-word; }

/* Submit area */
.submit-area {
  text-align: center;
  padding: 20px 0 40px;
}
#submitBtn {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 14px 36px;
  font-size: 1.05rem;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: background 0.2s, transform 0.1s;
}
#submitBtn:hover { background: var(--primary-light); }
#submitBtn:active { transform: scale(0.98); }
#submitBtn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* Result screens */
.result-screen, .already-taken {
  text-align: center;
  padding: 40px 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  max-width: 480px;
  margin: 40px auto;
}
.result-screen h2, .already-taken h2 {
  color: var(--primary);
  margin-bottom: 12px;
  font-size: 1.4rem;
}
.result-screen p, .already-taken p {
  color: var(--text-muted);
  margin-bottom: 8px;
  font-size: 1.05rem;
}
.result-name {
  font-weight: 700;
  color: var(--text);
  font-size: 1.15rem;
  margin-bottom: 16px;
}
.error-msg {
  color: var(--danger);
  background: var(--danger-bg);
  padding: 10px 14px;
  border-radius: 8px;
  margin: 14px 0;
  font-size: 0.95rem;
}
.retry-btn {
  background: var(--accent-dark);
  color: #fff;
  border: none;
  padding: 12px 28px;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}
.retry-btn:hover { opacity: 0.9; }

/* Superscripts / subscripts helpers */
sup { font-size: 0.75em; vertical-align: super; }
sub { font-size: 0.75em; vertical-align: sub; }

@media (max-width: 480px) {
  .header h1 { font-size: 1.1rem; }
  .logo { width: 90px; height: 90px; }
  .opt-label { flex: 1 1 100%; }
  .nav-grid { grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); }
}
</style>
</head>

    app.appendChild(nameBox);

    // Sticky bar
    const sticky = el("div", "sticky-bar");
    sticky.innerHTML = `
      <div class="sticky-inner">
        <span class="progress-info" id="progressInfo">0 of ${TOTAL} answered</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="timer" id="timer">00:00</span>
      </div>
    `;
    app.appendChild(sticky);

    // Navigator
    const navSec = el("div", "nav-section");
    navSec.innerHTML = `<h3>Question Navigator</h3><div class="nav-grid" id="navGrid"></div>`;
    app.appendChild(navSec);
    const navGrid = $("#navGrid");
    questions.forEach((q, i) => {
      const btn = el("button", "nav-btn", String(q.id));
      btn.type = "button";
      btn.dataset.idx = i;
      btn.onclick = () => {
        currentQ = i;
        const card = document.getElementById("q" + i);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
        updateProgress();
      };
      navGrid.appendChild(btn);
    });

    // Questions
    let lastSubject = "";
    questions.forEach((q, i) => {
      if (q.subject !== lastSubject) {
        app.appendChild(el("div", "subject-heading", q.subject.toUpperCase()));
        lastSubject = q.subject;
      }
      const card = el("div", "q-card");
      card.id = "q" + i;
      card.innerHTML = `<div class="q-num">Q${q.id}.</div><div class="q-text">${q.text}</div>`;
      const opts = el("div", "options");
      q.options.forEach((opt, oi) => {
        const lab = el("label", "opt-label");
        lab.dataset.q = i;
        lab.dataset.o = oi;
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "q" + i;
        radio.value = oi;
        radio.checked = answers[i] === oi;
        const span = el("span", "opt-text", labels[oi] + ") " + opt);
        lab.appendChild(radio);
        lab.appendChild(span);
        if (answers[i] === oi) lab.classList.add("selected");
        lab.addEventListener("click", function (e) {
          // allow change
          answers[i] = oi;
          currentQ = i;
          // update UI
          opts.querySelectorAll(".opt-label").forEach(l => l.classList.remove("selected"));
          lab.classList.add("selected");
          radio.checked = true;
          updateProgress();
        });
        opts.appendChild(lab);
      });
      card.appendChild(opts);
      app.appendChild(card);
    });

    // Submit
    const subArea = el("div", "submit-area");
    const btn = el("button", null, "Submit Test");
    btn.id = "submitBtn";
    btn.type = "button";
    btn.onclick = handleSubmit;
    subArea.appendChild(btn);
    app.appendChild(subArea);

    startTime = Date.now();
    startTimer();
    updateProgress();
  }

  // ===== SUBMIT =====
  function handleSubmit() {
    const nameInput = $("#studentName");
    const name = (nameInput.value || "").trim();
    let firstMissing = -1;

    // clear previous highlights
    document.querySelectorAll(".q-card").forEach(c => c.classList.remove("unanswered-highlight"));
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("unanswered-highlight"));
    nameInput.classList.remove("error");

    if (!name) {
      nameInput.classList.add("error");
      nameInput.focus();
      nameInput.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    answers.forEach((a, i) => {
      if (a === null) {
        if (firstMissing === -1) firstMissing = i;
        document.getElementById("q" + i).classList.add("unanswered-highlight");
        document.querySelectorAll(".nav-btn")[i].classList.add("unanswered-highlight");
      }
    });

    if (firstMissing !== -1) {
      document.getElementById("q" + firstMissing).scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    // All answered – compute score
    if (timerInterval) clearInterval(timerInterval);
    const timeTaken = formatTime(Date.now() - startTime);
    const submittedAt = new Date().toISOString();

    let chemScore = 0, engScore = 0;
    const incorrect = [];
    const answerSheet = [];

    questions.forEach((q, i) => {
      const chosen = answers[i];
      const isCorrect = chosen === q.correct;
      if (isCorrect) {
        if (q.subject === "Chemistry") chemScore++;
        else engScore++;
      } else {
        incorrect.push(
          `Q${q.id}: chose ${labels[chosen]}) ${q.options[chosen]} | correct ${labels[q.correct]}) ${q.options[q.correct]}`
        );
      }
      answerSheet.push(
        `Q${q.id} (${q.subject}): ${isCorrect ? "CORRECT" : "WRONG"} – selected ${labels[chosen]}) ${q.options[chosen]}`
      );
    });

    const totalScore = chemScore + engScore;
    const percentage = ((totalScore / TOTAL) * 100).toFixed(1);

    const payload = {
      access_key: ACCESS_KEY,
      subject: `MCQ Test Result: ${name} - ${totalScore}/${TOTAL} (${percentage}%)`,
      from_name: "Ali Raza Bright Academy MCQ System",
      student_name: name,
      total_score: `${totalScore}/${TOTAL}`,
      percentage: percentage + "%",
      chemistry_score: `${chemScore}/20`,
      english_score: `${engScore}/20`,
      time_taken: timeTaken,
      submitted_at: submittedAt,
      incorrect_answers: incorrect.length ? incorrect.join("\n") : "None – all correct",
      answer_sheet: answerSheet.join("\n")
    };

    // Mark attempt
    try {
      localStorage.setItem(STORAGE_KEY, "1");
      localStorage.setItem(PAYLOAD_KEY, JSON.stringify(payload));
    } catch (e) { /* ignore */ }

    sendResult(payload, name);
  }

  function sendResult(payload, name) {
    // Show temporary sending state
    const app = $("#app");
    app.innerHTML = `<div class="result-screen"><h2>Sending result…</h2><p>Please wait.</p></div>`;

    fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        try { localStorage.removeItem(PAYLOAD_KEY); } catch (e) {}
        renderResult(name, null);
      } else {
        renderResult(name, data.message || "Unknown error from server");
      }
    })
    .catch(err => {
      renderResult(name, err.message || "Network error");
    });
  }

  function retrySend(name) {
    let payload = null;
    try {
      const raw = localStorage.getItem(PAYLOAD_KEY);
      if (raw) payload = JSON.parse(raw);
    } catch (e) {}
    if (!payload) {
      renderResult(name, "No pending result found to resend.");
      return;
    }
    sendResult(payload, name);
  }

  function init() {
    let already = false;
    try {
      already = localStorage.getItem(STORAGE_KEY) === "1";
    } catch (e) {}

    if (already) {
      // Check if pending payload needs retry
      let pending = null;
      try {
        const raw = localStorage.getItem(PAYLOAD_KEY);
        if (raw) pending = JSON.parse(raw);
      } catch (e) {}

      if (pending) {
        // Show already-taken but also try to resend in background
        renderAlreadyTaken();
        // Attempt silent resend
        fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(pending)
        }).then(r => r.json()).then(data => {
          if (data.success) {
            try { localStorage.removeItem(PAYLOAD_KEY); } catch (e) {}
          }
        }).catch(() => {});
      } else {
        renderAlreadyTaken();
      }
      return;
    }

    renderTest();
  }

  // Start
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
