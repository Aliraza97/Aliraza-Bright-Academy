<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ali Raza Bright Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #eaeff6; --card: #ffffff; --text: #1a2233; --muted: #5d6880; --line: #d9e0ec;
  --accent: #3b3fd8; --accent-ink: #ffffff; --accent-soft: #e6e8ff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141f; --card: #1a2030; --text: #e8ecf6; --muted: #97a2bb; --line: #2b344b;
    --accent: #8b90ff; --accent-ink: #10141f; --accent-soft: #262a52;
  }
}
:root[data-theme="dark"] {
  --bg: #10141f; --card: #1a2030; --text: #e8ecf6; --muted: #97a2bb; --line: #2b344b;
  --accent: #8b90ff; --accent-ink: #10141f; --accent-soft: #262a52;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 48px; }
.hero { text-align: center; padding: 28px 12px 22px; }
.mark-img {
  width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 14px; display: block;
  object-fit: cover; box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
.hero h1 { margin: 0; font-size: 2rem; line-height: 1.15; }
.hero p { margin: 8px 0 0; color: var(--muted); font-size: 1.05rem; }
.label { font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 2px 10px; }
.steps { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; counter-reset: s; }
.steps li {
  counter-increment: s; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px 12px 54px; position: relative;
}
.steps li::before {
  content: counter(s); position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: .95rem;
}
.tests { display: grid; gap: 12px; }
.test { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.test h2 { margin: 0 0 10px; font-size: 1.2rem; line-height: 1.25; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 11px; font-size: .88rem; font-weight: 700; }
.go {
  display: block; text-align: center; text-decoration: none; background: var(--accent); color: var(--accent-ink);
  border-radius: 12px; padding: 13px 18px; font-weight: 700;
}
.go:hover { filter: brightness(1.08); }
.go:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.empty { color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; }
footer { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 34px; }
</style>
</head>

  { title: "Class XI Chemistry and English", level: "Class XI", subjects: ["Chemistry", "English"], questions: 40, file: "class-xi-chemistry-english.html" },
  { title: "Chemical Equilibrium", level: "Class X", subjects: ["Chemistry"], questions: 50, file: "class-x-chemistry-equilibrium.html" }
];

const box = document.getElementById("tests");
if (!TESTS.length) {
  const e = document.createElement("div");
  e.className = "empty";
  e.textContent = "No tests are available yet. Please check again later.";
  box.appendChild(e);
}
TESTS.forEach(t => {
  const card = document.createElement("div");
  card.className = "test";
  const h = document.createElement("h2");
  h.textContent = t.title;
  const chips = document.createElement("div");
  chips.className = "chips";
  [t.level, ...t.subjects, t.questions + " questions"].forEach(x => {
    const c = document.createElement("span");
    c.className = "chip"; c.textContent = x; chips.appendChild(c);
  });
  const a = document.createElement("a");
  a.className = "go"; a.href = t.file; a.textContent = "Start test";
  card.append(h, chips, a);
  box.appendChild(card);
});
</script>
</body>
</html>
