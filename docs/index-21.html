<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe2ee;--accent:#4f46e5;--accent2:#3730a3;--soft:#eef2ff;--shadow:0 12px 35px rgba(15,23,42,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#121a2b;--text:#f1f5f9;--muted:#a8b3c7;--line:#29354b;--accent:#818cf8;--accent2:#a5b4fc;--soft:#1c2140;--shadow:0 12px 35px rgba(0,0,0,.25)}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{width:min(100% - 24px,1000px);margin:auto} header{padding:30px 0 20px} .hero{display:flex;align-items:center;gap:16px}
.logo{width:72px;height:72px;border-radius:18px;object-fit:cover;border:2px solid var(--accent)}
h1{font-size:clamp(28px,6vw,42px);margin:0;line-height:1.1} .tag{color:var(--muted);margin:6px 0 0}
section{padding:16px 0 40px} h2{font-size:26px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:21px} .meta{color:var(--muted);font-size:15px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:11px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
.btn:hover{background:var(--accent2)} footer{text-align:center;color:var(--muted);padding:20px 0 35px;font-size:14px}
</style>
</head>
