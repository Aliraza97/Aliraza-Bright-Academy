<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class X Chemistry: Chemical Equilibrium Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #eaeff6; --card: #ffffff; --text: #1a2233; --muted: #5d6880; --line: #d9e0ec;
  --accent: #3b3fd8; --accent-ink: #ffffff; --accent-soft: #e6e8ff;
  --ok: #0f7a55; --ok-soft: #dff4ea; --bad: #b83232; --bad-soft: #fbe6e6;
  --warn: #a15c00; --warn-soft: #fff1d6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141f; --card: #1a2030; --text: #e8ecf6; --muted: #97a2bb; --line: #2b344b;
    --accent: #8b90ff; --accent-ink: #10141f; --accent-soft: #262a52;
    --ok: #4fd1a0; --ok-soft: #14352a; --bad: #ff8a8a; --bad-soft: #3d1d20;
    --warn: #ffc266; --warn-soft: #3a2b10;
  }
}
:root[data-theme="dark"] {
  --bg: #10141f; --card: #1a2030; --text: #e8ecf6; --muted: #97a2bb; --line: #2b344b;
  --accent: #8b90ff; --accent-ink: #10141f; --accent-soft: #262a52;
  --ok: #4fd1a0; --ok-soft: #14352a; --bad: #ff8a8a; --bad-soft: #3d1d20;
  --warn: #ffc266; --warn-soft: #3a2b10;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 70px); }
*, *::before, *::after { box-sizing: border-box; }
.q, .opts, .intro h1, .bar, .nav { -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-touch-callout: none; }
img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 48px; }
.screen[hidden] { display: none; }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; margin: 6px 0 14px; }
.intro h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 6px; }
.intro p { color: var(--muted); margin: 0 0 16px; }
label.field { display: block; font-weight: 700; margin-bottom: 6px; }
input[type="text"] {
  width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
input[type="text"]:focus { outline: none; border-color: var(--accent); }
button { font: inherit; cursor: pointer; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 13px 22px; font-weight: 700; width: 100%; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
.bar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; }
.bar-row .muted { color: var(--muted); font-weight: 400; }
.track { height: 8px; background: var(--line); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.nav { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 18px; }
.dot { aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--line); background: var(--card); color: var(--muted); font-size: .78rem; font-weight: 700; padding: 0; display: grid; place-items: center; }
.dot.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot.missing { border-color: var(--bad); color: var(--bad); }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.q.missing { border-color: var(--bad); background: var(--bad-soft); }
.q-text { display: flex; gap: 10px; margin: 0 0 12px; font-weight: 700; }
.q-num { color: var(--accent); min-width: 1.9em; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: block; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); line-height: 1.35; transition: background .12s, border-color .12s; }
.opt b { color: var(--accent); margin-right: 6px; }
.opt input:checked + span { background: var(--accent-soft); border-color: var(--accent); }
.opt:hover span { border-color: var(--accent); }
.submit-zone { margin-top: 22px; }
.msg { color: var(--bad); font-weight: 700; text-align: center; margin: 0 0 12px; min-height: 1.4em; }
.score-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 20px; text-align: center; margin-top: 18px; }
.score-card h2 { margin: 0 0 4px; font-size: 1.2rem; }
.verdict { font-weight: 700; font-size: 1.1rem; margin: 10px 0 4px; }
.later { color: var(--muted); margin: 0 0 6px; }
.sendstatus { margin: 10px 0 14px; font-weight: 700; color: var(--muted); }
.sendstatus.ok { color: var(--ok); }
.sendstatus.bad, .sendstatus.warn { color: var(--bad); }
.btns { display: grid; gap: 10px; }
@media (max-width: 480px) { body { font-size: 16px; } .nav { grid-template-columns: repeat(8, 1fr); } .opt span { padding: 8px 10px; } }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onselectstart="return false" ondragstart="return false">
<div class="wrap">

  <section id="test" class="screen">
    <div class="intro">
      <h1>Class X Chemistry: Chemical Equilibrium Test</h1>
      <p>Answer all 50 questions, then submit to see your result.</p>
      <label class="field" for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" placeholder="Enter your full name" maxlength="60">
    </div>
    <div class="bar" role="status" aria-live="polite">
      <div class="bar-row">
        <span id="count">0 of 50 answered</span>
        <span class="muted" id="clock">0:00</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="nav" id="nav" aria-label="Question navigator"></div>
    <div id="questions"></div>
    <div class="submit-zone">
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn" id="submitBtn" type="button">Submit test</button>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="score-card">
      <h2 id="who"></h2>
      <p class="verdict" id="verdictText">Test submitted</p>
      <p class="sendstatus" id="sendStatus" role="status"></p>
      <p class="later">Your result will be shared with you later.</p>
      <div class="btns">
        <button class="btn" id="resendBtn" type="button" hidden>Try sending again</button>
      </div>
    </div>
  </section>

</div>

<script>
const TEST_ID = "class10-chem-equilibrium";
const WEB3FORMS_KEY = "cbc036b9-fcea-46ed-9dfc-8a9d06d4cb30";
const SHEET_URL = "";
const LET = ["A", "B", "C", "D"];
const DONE_KEY = "mcq_" + TEST_ID + "_done_v1", PEND_KEY = "mcq_" + TEST_ID + "_pending_v1";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

const Q = [
  ["A reaction that proceeds only from left to right and generally goes to completion is known as a/an:", ["Equilibrium reaction", "Reversible reaction", "Irreversible reaction", "Reverse reaction"], 2],
  ["Which type of reaction does not normally proceed to completion?", ["Combustion reaction", "Reversible reaction", "Irreversible reaction", "Precipitation reaction"], 1],
  ["A reversible reaction in a chemical equation is represented by:", ["⇌", "→", "=", "⇢"], 0],
  ["Dynamic equilibrium is established when:", ["All reactants are converted into products", "The forward reaction stops", "The reverse reaction stops", "The rates of forward and reverse reactions become equal"], 3],
  ["A dynamic equilibrium can be established only in:", ["An open container", "A closed system at constant temperature", "Any container regardless of temperature", "A system containing excess reactant"], 1],
  ["The melting of ice and freezing of water represent:", ["A reversible change", "A nuclear change", "An irreversible change", "A combustion reaction"], 0],
  ["In the industrial preparation of ammonia, the forward reaction is:", ["NH₃ → N₂ + H₂", "N₂ + H₂ → NH₃", "N₂ + 3H₂ → 2NH₃", "2NH₃ → N₂ + 3H₂"], 2],
  ["According to the law of mass action, the rate of a reaction is directly proportional to the:", ["Temperature of the system", "Product of the active masses of reactants", "Volume of the container", "Concentration of products only"], 1],
  ["The term \"active mass\" refers to the:", ["Atomic mass of an element", "Mass of the catalyst", "Total mass of the reaction vessel", "Molar concentration of a reacting substance"], 3],
  ["The unit commonly used for active mass is:", ["mol·dm³", "g/mol", "mol·dm⁻³", "dm³/mol"], 2],
  ["For the reaction aA + bB ⇌ cC + dD, the forward reaction rate is:", ["Rf = kf[A]^a[B]^b", "Rf = kr[A]^a[B]^b", "Rf = kf[C]^c[D]^d", "Rf = kf[C]^a[D]^b"], 0],
  ["In the equation Kc = kf/kr, kf and kr are:", ["Molar masses", "Equilibrium concentrations", "Active masses", "Forward and reverse rate constants"], 3],
  ["The equilibrium constant Kc is expressed as the ratio of:", ["Product concentrations to reactant concentrations", "Reactant concentrations to product concentrations", "Catalyst concentration to reactant concentration", "Product concentration to catalyst concentration"], 0],
  ["For 2SO₂(g) + O₂(g) ⇌ 2SO₃(g), the correct Kc expression is:", ["Kc = [SO₂]²[O₂]/[SO₃]²", "Kc = [SO₃]/[SO₂][O₂]", "Kc = [SO₃]²/[SO₂]²[O₂]", "Kc = [SO₂][O₂]/[SO₃]"], 2],
  ["Which statement is NOT a characteristic of Kc?", ["Kc represents the equilibrium position", "Kc is affected by temperature", "Kc is used at equilibrium", "Kc depends on the initial concentrations of reactants and products"], 3],
  ["The equilibrium constant Kc is directly affected by a change in:", ["Temperature", "Pressure", "Volume", "Catalyst"], 0],
  ["If Kc is greater than 1, the equilibrium generally favors:", ["The reverse reaction", "The forward reaction", "Neither direction", "A non-spontaneous process"], 1],
  ["When the total number of moles of gaseous reactants equals that of gaseous products, Kc has:", ["Unit of mol·dm⁻³", "Unit of dm³/mol", "No unit", "Unit of mol²·dm⁻⁶"], 2],
  ["For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), the unit of Kc is:", ["mol·dm⁻³", "No unit", "mol²·dm⁻⁶", "mol⁻²·dm⁶"], 3],
  ["For CO₂(g) + H₂(g) ⇌ CO(g) + H₂O(l), the unit of Kc is:", ["No unit", "mol²·dm⁻⁶", "mol·dm⁻³", "mol⁻²·dm⁶"], 2],
  ["At 230°C, for 2NO(g) + O₂(g) ⇌ 2NO₂(g), if [NO] = 0.0542 mol·dm⁻³, [O₂] = 0.127 mol·dm⁻³ and [NO₂] = 15.5 mol·dm⁻³, Kc is approximately:", ["6.44 × 10⁻⁵ mol⁻¹·dm³", "0.644 mol⁻¹·dm³", "1.55 × 10⁵ mol⁻¹·dm³", "6.44 × 10⁵ mol⁻¹·dm³"], 3],
  ["For Fe³⁺(aq) + 4Cl⁻(aq) ⇌ FeCl₄⁻(aq), the correct equilibrium expression is:", ["Kc = [Fe³⁺][Cl⁻]⁴/[FeCl₄⁻]", "Kc = [FeCl₄⁻]/[Fe³⁺][Cl⁻]⁴", "Kc = [Fe³⁺]/[FeCl₄⁻][Cl⁻]⁴", "Kc = [FeCl₄⁻][Cl⁻]⁴/[Fe³⁺]"], 1],
  ["For Fe³⁺ + 4Cl⁻ ⇌ FeCl₄⁻, if [Fe³⁺] = 0.20 mol·dm⁻³, [Cl⁻] = 0.28 mol·dm⁻³ and [FeCl₄⁻] = 0.95 × 10⁻⁴ mol·dm⁻³, Kc is approximately:", ["7.72 × 10² mol⁻⁴·dm¹²", "1.7 × 10⁻² mol⁻⁴·dm¹²", "7.72 × 10⁻² mol⁻⁴·dm¹²", "0.95 × 10⁻⁴ mol⁻⁴·dm¹²"], 2],
  ["Unlike Kc, the reaction quotient Qc is calculated:", ["Only for irreversible reactions", "At any stage of a reaction, not necessarily at equilibrium", "Only when equilibrium is reached", "Using rate constants instead of concentrations"], 1],
  ["When Qc = Kc, the reaction system is:", ["Undergoing only the forward reaction", "Undergoing only the reverse reaction", "At dynamic equilibrium", "Completely stopped"], 2],
  ["If Qc < Kc, the reaction will proceed:", ["In the forward direction, producing more products", "In the reverse direction, producing more reactants", "In no particular direction", "Toward higher temperature"], 0],
  ["When Qc > Kc, the concentration of products decreases because:", ["The catalyst is consumed", "The temperature increases", "The reaction proceeds forward", "The reaction shifts in the reverse direction"], 3],
  ["For N₂(g) + O₂(g) ⇌ 2NO(g) at 2000°C, Kc = 4.1 × 10⁻⁴, [N₂] = 0.036 mol/L and [O₂] = 0.0089 mol/L. The concentration of NO is approximately:", ["1.3 × 10⁻⁷ mol/L", "0.036 mol/L", "3.6 × 10⁻⁴ mol/L", "4.1 × 10⁻⁴ mol/L"], 2],
  ["A very small Kc value, such as 7.4 × 10⁻¹³ for F₂(g) ⇌ 2F(g), indicates that:", ["Products are present in large amounts", "Reactants remain predominantly", "Equal amounts of reactants and products exist", "The reaction is exactly at equilibrium"], 1],
  ["A very large Kc value, such as 2.4 × 10⁴⁷ for water vapor formation, indicates that:", ["The reaction is virtually complete toward products", "Mostly reactants remain", "The reaction cannot proceed forward", "Kc cannot be used"], 0],
  ["A moderate Kc value, such as 0.36 for N₂O₄(g) ⇌ 2NO₂(g), indicates that:", ["Only products are present", "The reaction never occurs", "Only reactants are present", "Appreciable amounts of both reactants and products are present"], 3],
  ["The magnitude of Kc provides information about the:", ["Reaction rate only", "Color of products", "Extent of the reaction", "Physical state of reactants"], 2],
  ["A small value of Kc generally corresponds to a reaction mixture containing:", ["Mostly products", "Mostly reactants", "Equal quantities of reactants and products", "Neither reactants nor products"], 1],
  ["A moderate Kc generally indicates a mixture containing:", ["Only reactants", "Mostly products", "Comparable amounts of reactants and products", "No reacting substances"], 2],
  ["A large Kc generally indicates a mixture containing:", ["Mostly products", "Mostly reactants", "No products", "No equilibrium"], 0],
  ["One important practical use of Kc is to predict the:", ["Molecular mass of reactants", "Reaction rate", "Color of the mixture", "Direction and extent of a reaction"], 3],
  ["Nitrogen gas from the atmosphere is mainly used industrially to manufacture:", ["Carbon dioxide", "Ammonia", "Sulphuric acid", "Sulphur dioxide"], 1],
  ["Oxygen gas from the atmosphere is used industrially in the preparation of:", ["Ammonia", "Nitrogenous fertilizers", "Nitrogen monoxide", "Sulphur dioxide"], 3],
  ["Which statement describes the forward reaction macroscopically as equilibrium is approached?", ["Its rate is initially high and gradually decreases", "Its rate continuously increases", "It always proceeds from right to left", "Products continuously produce reactants"], 0],
  ["Which statement describes the reverse reaction as equilibrium is approached?", ["It never occurs in a closed system", "It always proceeds from left to right", "Its rate starts low and gradually increases", "Its rate starts high and gradually decreases"], 2],
  ["Which condition is necessary for dynamic equilibrium?", ["Continuous addition of reactants", "A closed system in which substances cannot enter or leave", "Continuously increasing temperature", "Constant addition of catalyst"], 1],
  ["At dynamic equilibrium, the concentrations of reactants and products:", ["Become zero", "Increase continuously", "Remain constant", "Decrease continuously"], 2],
  ["A reversible reaction can reach equilibrium:", ["Only from the reactant side", "Only under high pressure", "Only from the product side", "From either side of the reaction"], 3],
  ["Which statement about Kc is correct?", ["Kc depends on initial concentrations", "Kc depends on the volume of the container", "Kc is independent of initial concentrations", "Kc changes when a catalyst is added"], 2],
  ["In the hydrogen-iodine equilibrium demonstration, the color changes as the reaction proceeds forward from:", ["Dark purple to light", "Light purple to darker purple", "Colorless to bright red", "Red to yellow"], 0],
  ["The absence of visible change at equilibrium in the hydrogen-iodine system occurs because:", ["The reaction has completely stopped", "Hydrogen iodide is no longer formed", "Both reactions have stopped", "The forward and reverse reaction rates are equal"], 3],
  ["The rate of the forward reaction mainly depends on the concentration of:", ["Reactants", "Products only", "Catalyst only", "Solvent"], 0],
  ["As a reversible reaction approaches equilibrium, the rate of the forward reaction generally:", ["Remains constant", "Becomes zero immediately", "Decreases as reactant concentration decreases", "Increases continuously"], 2],
  ["The decomposition of sodium bicarbonate, 2NaHCO₃ → Na₂CO₃ + CO₂ + H₂O, is generally classified as:", ["Reversible", "Equilibrium reaction", "Catalyzed", "Irreversible"], 3],
  ["In Kc = [C]^c[D]^d / [A]^a[B]^b, the exponents a, b, c and d represent the:", ["Oxidation states of the elements", "Stoichiometric coefficients in the balanced equation", "Molar masses of substances", "Number of catalyst molecules used"], 1]
];
const N = Q.length;
let answers = new Array(N).fill(null);
let lastPayload = null;
let startTime = 0, timer = null, studentName = "";

const $ = id => document.getElementById(id);
const show = id => { ["test","result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); };
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function buildTest() {
  const qs = $("questions"), nav = $("nav");
  qs.innerHTML = ""; nav.innerHTML = "";
  Q.forEach((q, i) => {
    const d = document.createElement("div");
    d.className = "q"; d.id = "q" + i;
    const p = document.createElement("p");
    p.className = "q-text";
    p.innerHTML = '<span class="q-num">' + (i + 1) + '.</span><span></span>';
    p.lastChild.textContent = q[0];
    d.appendChild(p);
    const o = document.createElement("div");
    o.className = "opts"; o.setAttribute("role", "radiogroup");
    q[1].forEach((t, j) => {
      const l = document.createElement("label");
      l.className = "opt";
      l.innerHTML = '<input type="radio" name="q' + i + '" value="' + j + '"><span><b>' + LET[j] + ')</b></span>';
      l.querySelector("span").append(document.createTextNode(t));
      l.querySelector("input").addEventListener("change", () => { answers[i] = j; refresh(); });
      o.appendChild(l);
    });
    d.appendChild(o);
    qs.appendChild(d);

    const b = document.createElement("button");
    b.type = "button"; b.className = "dot"; b.id = "dot" + i;
    b.textContent = i + 1; b.setAttribute("aria-label", "Go to question " + (i + 1));
    b.addEventListener("click", () => $("q" + i).scrollIntoView({ behavior: "smooth", block: "start" }));
    nav.appendChild(b);
  });
}

function refresh() {
  const done = answers.filter(a => a !== null).length;
  $("count").textContent = done + " of " + N + " answered";
  $("fill").style.width = (done / N * 100) + "%";
  answers.forEach((a, i) => {
    const dot = $("dot" + i);
    dot.classList.toggle("done", a !== null);
    if (a !== null) { dot.classList.remove("missing"); $("q" + i).classList.remove("missing"); }
  });
  if (done === N) $("msg").textContent = "";
}

function startTest() {
  answers = new Array(N).fill(null);
  buildTest(); refresh();
  startTime = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { $("clock").textContent = fmt(Math.floor((Date.now() - startTime) / 1000)); }, 1000);
  $("clock").textContent = "0:00";
  show("test");
}

async function sendResult() {
  const st = $("sendStatus"), rb = $("resendBtn");
  rb.hidden = true;
  if (!WEB3FORMS_KEY || WEB3FORMS_KEY.indexOf("PASTE") === 0) {
    st.className = "sendstatus warn";
    st.textContent = "Your result could not be sent to the teacher because email is not set up yet. Please show this screen to your teacher.";
    return;
  }
  st.className = "sendstatus";
  st.textContent = "Sending your result to the teacher…";
  try {
    const r = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(lastPayload)
    });
    const j = await r.json();
    if (!j.success) throw new Error(j.message || "failed");
    st.className = "sendstatus ok";
    st.textContent = "Your result has been sent to the teacher.";
    lsDel(PEND_KEY);
  } catch (e) {
    st.className = "sendstatus bad";
    st.textContent = "Your result could not be sent (" + (e && e.message ? e.message : "unknown error") + "). Check your internet connection and try again.";
    rb.hidden = false;
  }
}

function sendToSheet() {
  if (!SHEET_URL) return;
  try {
    const d = Object.assign({}, lastPayload);
    delete d.access_key;
    fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(d) }).catch(() => {});
  } catch (e) {}
}

function submitTest() {
  if (!$("name").value.trim()) {
    $("msg").textContent = "Please enter your name before submitting.";
    $("name").focus();
    $("name").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const missing = answers.map((a, i) => a === null ? i : -1).filter(i => i >= 0);
  if (missing.length) {
    missing.forEach(i => { $("q" + i).classList.add("missing"); $("dot" + i).classList.add("missing"); });
    $("msg").textContent = missing.length + (missing.length === 1 ? " question is" : " questions are") + " still unanswered. Please answer all questions before submitting.";
    $("q" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  clearInterval(timer);
  const secs = Math.floor((Date.now() - startTime) / 1000);
  let right = 0;
  answers.forEach((a, i) => { if (a === Q[i][2]) right++; });
  const pct = Math.round(right / N * 100);
  studentName = $("name").value.trim();

  const wrongList = Q.map((q, i) => answers[i] === q[2] ? null : "Q" + (i + 1) + ": chose " + LET[answers[i]] + ", correct " + LET[q[2]]).filter(Boolean).join("\n") || "None";
  const sheet = Q.map((q, i) => "Q" + (i + 1) + ": " + (answers[i] === q[2] ? "Correct" : "Wrong")).join("\n");

  lastPayload = {
    access_key: WEB3FORMS_KEY,
    subject: "MCQ Test Result: " + studentName + " - " + right + "/" + N + " (" + pct + "%)",
    from_name: "Class X Chemical Equilibrium Test",
    student_name: studentName,
    test_title: "Class X Chemistry: Chemical Equilibrium",
    total_score: right + " / " + N,
    percentage: pct + "%",
    chemistry: right + " / " + N,
    time_taken: fmt(secs),
    submitted_at: new Date().toLocaleString(),
    score: right,
    out_of: N,
    percent: pct,
    incorrect_answers: wrongList,
    answer_sheet: sheet
  };

  $("who").textContent = studentName;
  lsSet(DONE_KEY, "1");
  lsSet(PEND_KEY, JSON.stringify(lastPayload));
  sendToSheet();
  sendResult();
  show("result");
}

function showAlreadyDone() {
  $("who").textContent = "You have already taken this test";
  $("verdictText").textContent = "Only one attempt is allowed.";
  const st = $("sendStatus");
  const pend = lsGet(PEND_KEY);
  let parsed = null;
  if (pend) { try { parsed = JSON.parse(pend); } catch (e) {} }
  if (parsed) { lastPayload = parsed; sendResult(); }
  else { st.className = "sendstatus ok"; st.textContent = "Your result has been sent to the teacher."; }
  show("result");
}

document.addEventListener("keydown", e => {
  const k = (e.key || "").toLowerCase();
  if (k === "printscreen" || (e.ctrlKey && (k === "p" || k === "s" || k === "u" || k === "c")) || (e.ctrlKey && e.shiftKey && k === "i") || k === "f12") {
    e.preventDefault();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { try { navigator.clipboard.writeText(""); } catch (e) {} }
});

$("submitBtn").addEventListener("click", submitTest);
$("resendBtn").addEventListener("click", sendResult);

if (lsGet(DONE_KEY) === "1") showAlreadyDone(); else startTest();
</script>
</body>
</html>
