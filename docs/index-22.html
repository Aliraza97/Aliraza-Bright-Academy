<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class X Chemistry: Acid, Base and Salt Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #eaeff6; --card: #ffffff; --text: #1a2233; --muted: #5d6880; --line: #d9e0ec;
  --accent: #3b3fd8; --accent-ink: #ffffff; --accent-soft: #e6e8ff;
  --ok: #0f7a55; --ok-soft: #dff4ea; --bad: #b83232; --bad-soft: #fbe6e6;
  --warn: #a15c00; --warn-soft: #fff1d6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141f; --card: #1a2030; --text: #e8ecf6; --muted: #97a2bb; --line: #2b344b;
    --accent: #8b90ff; --accent-ink: #10141f; --accent-soft: #262a52;
    --ok: #4fd1a0; --ok-soft: #14352a; --bad: #ff8a8a; --bad-soft: #3d1d20;
    --warn: #ffc266; --warn-soft: #3a2b10;
  }
}
:root[data-theme="dark"] {
  --bg: #10141f; --card: #1a2030; --text: #e8ecf6; --muted: #97a2bb; --line: #2b344b;
  --accent: #8b90ff; --accent-ink: #10141f; --accent-soft: #262a52;
  --ok: #4fd1a0; --ok-soft: #14352a; --bad: #ff8a8a; --bad-soft: #3d1d20;
  --warn: #ffc266; --warn-soft: #3a2b10;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 70px); }
*, *::before, *::after { box-sizing: border-box; }
.q, .opts, .intro h1, .bar, .nav { -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-touch-callout: none; }
img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 48px; }
.screen[hidden] { display: none; }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; margin: 6px 0 14px; }
.intro h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 6px; }
.intro p { color: var(--muted); margin: 0 0 16px; }
label.field { display: block; font-weight: 700; margin-bottom: 6px; }
input[type="text"] {
  width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
input[type="text"]:focus { outline: none; border-color: var(--accent); }
button { font: inherit; cursor: pointer; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 13px 22px; font-weight: 700; width: 100%; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
.bar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; }
.bar-row .muted { color: var(--muted); font-weight: 400; }
.track { height: 8px; background: var(--line); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.nav { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 18px; }
.dot { aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--line); background: var(--card); color: var(--muted); font-size: .78rem; font-weight: 700; padding: 0; display: grid; place-items: center; }
.dot.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot.missing { border-color: var(--bad); color: var(--bad); }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.q.missing { border-color: var(--bad); background: var(--bad-soft); }
.q-text { display: flex; gap: 10px; margin: 0 0 12px; font-weight: 700; }
.q-num { color: var(--accent); min-width: 1.9em; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt span { display: block; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); line-height: 1.35; transition: background .12s, border-color .12s; }
.opt b { color: var(--accent); margin-right: 6px; }
.opt input:checked + span { background: var(--accent-soft); border-color: var(--accent); }
.opt:hover span { border-color: var(--accent); }
.submit-zone { margin-top: 22px; }
.msg { color: var(--bad); font-weight: 700; text-align: center; margin: 0 0 12px; min-height: 1.4em; }
.score-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 20px; text-align: center; margin-top: 18px; }
.score-card h2 { margin: 0 0 4px; font-size: 1.2rem; }
.verdict { font-weight: 700; font-size: 1.1rem; margin: 10px 0 4px; }
.later { color: var(--muted); margin: 0 0 6px; }
.sendstatus { margin: 10px 0 14px; font-weight: 700; color: var(--muted); }
.sendstatus.ok { color: var(--ok); }
.sendstatus.bad, .sendstatus.warn { color: var(--bad); }
.btns { display: grid; gap: 10px; }
@media (max-width: 480px) { body { font-size: 16px; } .nav { grid-template-columns: repeat(8, 1fr); } .opt span { padding: 8px 10px; } }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" onselectstart="return false" ondragstart="return false">
<div class="wrap">

  <section id="test" class="screen">
    <div class="intro">
      <h1>Class X Chemistry: Acid, Base and Salt Test</h1>
      <p>Answer all 50 questions, then submit to see your result.</p>
      <label class="field" for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" placeholder="Enter your full name" maxlength="60">
    </div>
    <div class="bar" role="status" aria-live="polite">
      <div class="bar-row">
        <span id="count">0 of 50 answered</span>
        <span class="muted" id="clock">0:00</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="nav" id="nav" aria-label="Question navigator"></div>
    <div id="questions"></div>
    <div class="submit-zone">
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn" id="submitBtn" type="button">Submit test</button>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="score-card">
      <h2 id="who"></h2>
      <p class="verdict" id="verdictText">Test submitted</p>
      <p class="sendstatus" id="sendStatus" role="status"></p>
      <p class="later">Your result will be shared with you later.</p>
      <div class="btns">
        <button class="btn" id="resendBtn" type="button" hidden>Try sending again</button>
      </div>
    </div>
  </section>

</div>

<script>
const TEST_ID = "class10-chem-acid-base-salt";
const WEB3FORMS_KEY = "cbc036b9-fcea-46ed-9dfc-8a9d06d4cb30";
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyXuX-aIOiW0JrEpjsW5huHz7IQl_NkGIVQwioBd92hIzR9JeDumnDnkFbCJbtesCoT/exec";
const LET = ["A", "B", "C", "D"];
const DONE_KEY = "mcq_" + TEST_ID + "_done_v1", PEND_KEY = "mcq_" + TEST_ID + "_pending_v1";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

const Q = [
  ["According to the Arrhenius concept, an acid produces which ion when dissolved in water?", ["Na⁺", "OH⁻", "H⁺", "H₃O⁻"], 2],
  ["According to Arrhenius theory, a base increases the concentration of:", ["Cl⁻", "H⁺", "H₃O⁺", "OH⁻"], 3],
  ["Which of the following is NOT an Arrhenius acid?", ["CH₃COOH", "NaOH", "HCl", "HNO₃"], 1],
  ["One important limitation of Arrhenius theory is that it:", ["Is mainly applicable to aqueous solutions", "Explains NH₃ as a base", "Applies equally to all solvents", "Explains CO₂ acidity"], 0],
  ["The Bronsted-Lowry theory of acids and bases was proposed by:", ["Lewis and Sorensen", "Arrhenius and Lewis", "Bronsted and Lowry", "Sorensen and Arrhenius"], 2],
  ["According to Bronsted-Lowry theory, an acid is a substance that:", ["Accepts an electron pair", "Donates a proton", "Produces OH⁻", "Accepts a proton"], 1],
  ["A Bronsted-Lowry base is a substance that:", ["Accepts a proton", "Donates a proton", "Produces hydrogen ions", "Accepts an electron pair"], 0],
  ["In the reaction HCl + H₂O ⇌ H₃O⁺ + Cl⁻, H₂O acts as:", ["A catalyst", "An acid", "A salt", "A base"], 3],
  ["In the reaction HCl + H₂O ⇌ H₃O⁺ + Cl⁻, which species is the conjugate acid?", ["H₂O", "Cl⁻", "H₃O⁺", "HCl"], 2],
  ["In the reaction CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺, the conjugate base is:", ["CH₃COO⁻", "H₂O", "H₃O⁺", "CH₃COOH"], 0],
  ["A conjugate acid is formed when a base:", ["Donates an electron pair", "Accepts a proton", "Donates a proton", "Accepts an electron pair"], 1],
  ["Which substance cannot be considered an acid according to the Bronsted-Lowry concept?", ["H₂SO₄", "CO₂", "HCl", "CH₃COOH"], 1],
  ["According to Lewis theory, an acid is a substance that:", ["Accepts an electron pair", "Donates a proton", "Donates an electron pair", "Accepts a proton"], 0],
  ["According to Lewis theory, a base is a substance that:", ["Produces OH⁻ ions", "Accepts an electron pair", "Donates an electron pair", "Donates a proton"], 2],
  ["In the reaction H⁺ + :OH₂ → H₃O⁺, water behaves as a:", ["Neutral substance", "Lewis base", "Lewis acid", "Bronsted acid only"], 1],
  ["In the reaction NH₃ + BF₃ → H₃N:BF₃, BF₃ acts as a:", ["Bronsted base", "Lewis base", "Bronsted acid", "Lewis acid"], 3],
  ["Which theory provides an explanation of covalent bond formation and molecular structures?", ["Lewis theory", "Arrhenius theory", "Kinetic theory", "Bronsted-Lowry theory"], 0],
  ["The concept of pH was first introduced by:", ["Lewis at Berkeley", "Sorensen at the Carlsberg Laboratory", "Arrhenius at Stockholm", "Bronsted at Oxford"], 1],
  ["The symbol pH is commonly associated with:", ["Positive Hydrogen", "Percent Hydrogen", "Potential Hydrogen", "Proton Held"], 2],
  ["The mathematical expression for pH is:", ["−log[H⁺]", "[H⁺][OH⁻]", "log[H⁺]", "−log[OH⁻]"], 0],
  ["The mathematical expression for pOH is:", ["−log[H⁺]", "[H⁺]/[OH⁻]", "log[OH⁻]", "−log[OH⁻]"], 3],
  ["At 25°C, the ionic product of water, Kw, is approximately:", ["1 × 10⁷", "1 × 10⁻¹⁴", "1 × 10⁻⁷", "1 × 10¹⁴"], 1],
  ["At 25°C, the relationship between pH and pOH is:", ["pH − pOH = 14", "pH × pOH = 14", "pH + pOH = 14", "pH = pOH"], 2],
  ["Pure water is considered a weak electrolyte because:", ["It contains excess OH⁻ ions", "It does not ionize at all", "It contains excess H⁺ ions", "Only a small fraction of its molecules ionize"], 3],
  ["A solution having a pH of 7 at 25°C is:", ["Neutral", "Strongly acidic", "Basic", "A buffer"], 0],
  ["A solution with a pH between 1 and 6 is generally:", ["Amphoteric", "Basic", "Acidic", "Neutral"], 2],
  ["A solution with a pH between 8 and 14 is generally:", ["Neutral", "Basic", "Acidic", "Amphoteric"], 1],
  ["If the pH of a solution is 2.3, its approximate pOH is:", ["14.0", "7.0", "2.3", "11.7"], 3],
  ["What is the pH of a solution having [H⁺] = 1 × 10⁻³ mol dm⁻³?", ["3", "11", "1", "14"], 0],
  ["Which of the following is obtained from a natural source and can be used as an acid-base indicator?", ["pH meter", "Universal indicator", "Red cabbage extract", "Litmus paper"], 2],
  ["An acidic solution generally changes universal indicator to:", ["Blue or purple", "Red, orange or yellow", "Green", "Colorless"], 1],
  ["A basic solution generally changes universal indicator to:", ["Orange", "Red", "Green", "Blue or purple"], 3],
  ["A neutral solution usually gives which color with universal indicator?", ["Green", "Yellow", "Purple", "Red"], 0],
  ["A salt is an ionic compound generally containing:", ["Only hydrogen ions", "Only hydroxide ions", "A cation derived from a base and an anion derived from an acid", "A cation from an acid and an anion from a base"], 2],
  ["The other product formed along with a salt during a typical acid-base neutralization is:", ["Hydrogen gas", "Carbon dioxide", "Oxygen", "Water"], 3],
  ["What salt is produced in the reaction NaOH + HCl → NaCl + H₂O?", ["Hydrochloric acid", "Sodium chloride", "Sodium hydroxide", "Water"], 1],
  ["What salt is formed when 2KOH reacts with H₂SO₄?", ["Potassium chloride", "Sulphuric acid", "Potassium sulphate", "Potassium hydroxide"], 2],
  ["Acids can react with all of the following to produce salts EXCEPT:", ["Metal carbonates", "Noble gases", "Metals", "Metal oxides"], 1],
  ["In the reaction CaO + H₂SO₄ → CaSO₄ + H₂O, CaO is a:", ["Metal oxide", "Salt", "Acid", "Indicator"], 0],
  ["A solution formed from an acidic salt generally has a pH:", ["Greater than 7", "Equal to 14", "Equal to 7", "Less than 7"], 3],
  ["Which of the following is an example of an acidic salt?", ["KNO₃", "CH₃COONa", "NH₄Cl", "NaCl"], 2],
  ["A solution containing a basic salt generally has a pH:", ["Greater than 7", "Less than 7", "Equal to 0", "Equal to 7"], 0],
  ["Which of the following is an example of a basic salt?", ["BaCl₂", "NaHSO₄", "K₂CO₃", "NaH₂PO₄"], 2],
  ["A neutral salt is typically produced by the complete neutralization of:", ["A weak acid and a strong base", "A strong acid and a strong base", "A strong acid and a weak base", "A weak acid and a weak base"], 1],
  ["Which of the following is a neutral salt?", ["NaCl", "NH₄Cl", "NaHSO₄", "K₂CO₃"], 0],
  ["A buffer solution is one that:", ["Always has a pH of 7", "Has an extremely unstable pH", "Cannot contain a weak acid", "Resists significant changes in pH when small amounts of acid or base are added"], 3],
  ["An acidic buffer usually consists of:", ["A weak acid and its salt", "A strong acid and strong base", "A strong base and its salt", "A weak base and its salt"], 0],
  ["Which combination represents an acidic buffer?", ["HCl–KCl", "CH₃COOH–CH₃COONa", "NH₃–NH₄Cl", "NaOH–NaCl"], 1],
  ["The pH of a buffer solution is generally affected by:", ["Nothing", "Only pressure", "Temperature", "No factors at all"], 2],
  ["Sodium hydrogen carbonate is used as an antacid because it:", ["Produces hydrochloric acid", "Has no reaction with acids", "Increases stomach acidity", "Neutralizes excess acid in the stomach"], 3]
];
const N = Q.length;
let answers = new Array(N).fill(null);
let lastPayload = null;
let startTime = 0, timer = null, studentName = "";

const $ = id => document.getElementById(id);
const show = id => { ["test","result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); };
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function buildTest() {
  const qs = $("questions"), nav = $("nav");
  qs.innerHTML = ""; nav.innerHTML = "";
  Q.forEach((q, i) => {
    const d = document.createElement("div");
    d.className = "q"; d.id = "q" + i;
    const p = document.createElement("p");
    p.className = "q-text";
    p.innerHTML = '<span class="q-num">' + (i + 1) + '.</span><span></span>';
    p.lastChild.textContent = q[0];
    d.appendChild(p);
    const o = document.createElement("div");
    o.className = "opts"; o.setAttribute("role", "radiogroup");
    q[1].forEach((t, j) => {
      const l = document.createElement("label");
      l.className = "opt";
      l.innerHTML = '<input type="radio" name="q' + i + '" value="' + j + '"><span><b>' + LET[j] + ')</b></span>';
      l.querySelector("span").append(document.createTextNode(t));
      l.querySelector("input").addEventListener("change", () => { answers[i] = j; refresh(); });
      o.appendChild(l);
    });
    d.appendChild(o);
    qs.appendChild(d);

    const b = document.createElement("button");
    b.type = "button"; b.className = "dot"; b.id = "dot" + i;
    b.textContent = i + 1; b.setAttribute("aria-label", "Go to question " + (i + 1));
    b.addEventListener("click", () => $("q" + i).scrollIntoView({ behavior: "smooth", block: "start" }));
    nav.appendChild(b);
  });
}

function refresh() {
  const done = answers.filter(a => a !== null).length;
  $("count").textContent = done + " of " + N + " answered";
  $("fill").style.width = (done / N * 100) + "%";
  answers.forEach((a, i) => {
    const dot = $("dot" + i);
    dot.classList.toggle("done", a !== null);
    if (a !== null) { dot.classList.remove("missing"); $("q" + i).classList.remove("missing"); }
  });
  if (done === N) $("msg").textContent = "";
}

function startTest() {
  answers = new Array(N).fill(null);
  buildTest(); refresh();
  startTime = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { $("clock").textContent = fmt(Math.floor((Date.now() - startTime) / 1000)); }, 1000);
  $("clock").textContent = "0:00";
  show("test");
}

async function sendResult() {
  const st = $("sendStatus"), rb = $("resendBtn");
  rb.hidden = true;
  if (!WEB3FORMS_KEY || WEB3FORMS_KEY.indexOf("PASTE") === 0) {
    st.className = "sendstatus warn";
    st.textContent = "Your result could not be sent to the teacher because email is not set up yet. Please show this screen to your teacher.";
    return;
  }
  st.className = "sendstatus";
  st.textContent = "Sending your result to the teacher…";
  try {
    const r = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(lastPayload)
    });
    const j = await r.json();
    if (!j.success) throw new Error(j.message || "failed");
    st.className = "sendstatus ok";
    st.textContent = "Your result has been sent to the teacher.";
    lsDel(PEND_KEY);
  } catch (e) {
    st.className = "sendstatus bad";
    st.textContent = "Your result could not be sent (" + (e && e.message ? e.message : "unknown error") + "). Check your internet connection and try again.";
    rb.hidden = false;
  }
}

function sendToSheet() {
  if (!SHEET_URL) return;
  try {
    const d = Object.assign({}, lastPayload);
    delete d.access_key;
    fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(d) }).catch(() => {});
  } catch (e) {}
}

function submitTest() {
  if (!$("name").value.trim()) {
    $("msg").textContent = "Please enter your name before submitting.";
    $("name").focus();
    $("name").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const missing = answers.map((a, i) => a === null ? i : -1).filter(i => i >= 0);
  if (missing.length) {
    missing.forEach(i => { $("q" + i).classList.add("missing"); $("dot" + i).classList.add("missing"); });
    $("msg").textContent = missing.length + (missing.length === 1 ? " question is" : " questions are") + " still unanswered. Please answer all questions before submitting.";
    $("q" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  clearInterval(timer);
  const secs = Math.floor((Date.now() - startTime) / 1000);
  let right = 0;
  answers.forEach((a, i) => { if (a === Q[i][2]) right++; });
  const pct = Math.round(right / N * 100);
  studentName = $("name").value.trim();

  const wrongList = Q.map((q, i) => answers[i] === q[2] ? null : "Q" + (i + 1) + ": chose " + LET[answers[i]] + ", correct " + LET[q[2]]).filter(Boolean).join("\n") || "None";
  const sheet = Q.map((q, i) => "Q" + (i + 1) + ": " + (answers[i] === q[2] ? "Correct" : "Wrong")).join("\n");

  lastPayload = {
    access_key: WEB3FORMS_KEY,
    subject: "MCQ Test Result: " + studentName + " - " + right + "/" + N + " (" + pct + "%)",
    from_name: "Class X Acid, Base and Salt Test",
    student_name: studentName,
    test_title: "Class X Chemistry: Acid, Base and Salt",
    total_score: right + " / " + N,
    percentage: pct + "%",
    chemistry: right + " / " + N,
    time_taken: fmt(secs),
    submitted_at: new Date().toLocaleString(),
    score: right,
    out_of: N,
    percent: pct,
    incorrect_answers: wrongList,
    answer_sheet: sheet
  };

  $("who").textContent = studentName;
  lsSet(DONE_KEY, "1");
  lsSet(PEND_KEY, JSON.stringify(lastPayload));
  sendToSheet();
  sendResult();
  show("result");
}

function showAlreadyDone() {
  $("who").textContent = "You have already taken this test";
  $("verdictText").textContent = "Only one attempt is allowed.";
  const st = $("sendStatus");
  const pend = lsGet(PEND_KEY);
  let parsed = null;
  if (pend) { try { parsed = JSON.parse(pend); } catch (e) {} }
  if (parsed) { lastPayload = parsed; sendResult(); }
  else { st.className = "sendstatus ok"; st.textContent = "Your result has been sent to the teacher."; }
  show("result");
}

document.addEventListener("keydown", e => {
  const k = (e.key || "").toLowerCase();
  if (k === "printscreen" || (e.ctrlKey && (k === "p" || k === "s" || k === "u" || k === "c")) || (e.ctrlKey && e.shiftKey && k === "i") || k === "f12") {
    e.preventDefault();
  }
});

$("submitBtn").addEventListener("click", submitTest);
$("resendBtn").addEventListener("click", sendResult);

if (lsGet(DONE_KEY) === "1") showAlreadyDone(); else startTest();
</script>
</body>
</html>
